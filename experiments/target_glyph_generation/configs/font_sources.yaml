# 仅记录已在上游项目核验到 OFL-1.1 的候选来源。
# local_path 是数据集根目录 fonts/ 下的相对路径；构建前会核验文件、许可证副本和 SHA-256。
# 三个 Noto 可变字体会在下载后固化为指定 wght 的静态 TTF，避免训练时依赖可变字体轴。
fonts:
  - &noto_sans_sc
    font_id: noto_sans_sc_100
    display_name: Noto Sans SC Thin
    version: Google Fonts main, wght=100
    source_url: https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf
    license_id: OFL-1.1
    license_url: https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/OFL.txt
    local_path: fonts/noto_sans_sc_100.ttf
  - <<: *noto_sans_sc
    font_id: noto_sans_sc_200
    display_name: Noto Sans SC ExtraLight
    version: Google Fonts main, wght=200
    local_path: fonts/noto_sans_sc_200.ttf
  - <<: *noto_sans_sc
    font_id: noto_sans_sc_300
    display_name: Noto Sans SC Light
    version: Google Fonts main, wght=300
    local_path: fonts/noto_sans_sc_300.ttf
  - <<: *noto_sans_sc
    font_id: noto_sans_sc_400
    display_name: Noto Sans SC Regular
    version: Google Fonts main, wght=400
    local_path: fonts/noto_sans_sc_400.ttf
  - <<: *noto_sans_sc
    font_id: noto_sans_sc_500
    display_name: Noto Sans SC Medium
    version: Google Fonts main, wght=500
    local_path: fonts/noto_sans_sc_500.ttf
  - <<: *noto_sans_sc
    font_id: noto_sans_sc_700
    display_name: Noto Sans SC Bold
    version: Google Fonts main, wght=700
    local_path: fonts/noto_sans_sc_700.ttf
  - <<: *noto_sans_sc
    font_id: noto_sans_sc_900
    display_name: Noto Sans SC Black
    version: Google Fonts main, wght=900
    local_path: fonts/noto_sans_sc_900.ttf

  - &noto_serif_sc
    font_id: noto_serif_sc_200
